name: Ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Yarn 4.9.2
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
          yarn --version
      - run: yarn install

      - name: 1. Type check
        run: npx tsc --noEmit

      - name: 2. Build (tsconfig.build.json)
        run: yarn build

      - name: 3. Build check
        run: |
          ls -lh lib/Cli/index.js
          ls -lh lib/Cli/welcome.txt
          node lib/Cli/index.js --help
